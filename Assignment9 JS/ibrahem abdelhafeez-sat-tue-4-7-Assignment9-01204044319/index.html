<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid container-xl pt-2">
      <div class="d-flex align-items-center gap-1 gap-sm-3">
        <div class="w-11 h-11 d-flex align-items-center justify-content-center bg-purple rounded-3">
          <span class="fa-solid fa-address-book text-white  fs-5"></span>
        </div>
        <div>
          <h1 class="mb-0 fs-4 fw-bold">
            Contact<span class="text-primary">Hub
            </span>
          </h1>
          <p class="mb-0 d-none d-sm-block fs-12 text-secondary">
            Smart Contact Manager
          </p>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2 gap-sm-3">
        <!-- Button trigger modal -->
        <button type="button"
          class="btn add-contact-btn bg-purple text-white fw-semibold fs-14 px-2 px-sm-3 py-2 rounded-3"
          data-bs-toggle="modal" data-bs-target="#staticBackdrop">
          <span class="fa-solid fa-plus"></span>
          Add
          <span class="d-none d-sm-inline-block">
            Contact
          </span>
        </button>
        <!-- Modal -->
        <div class="modal fade contact-modal" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false"
          tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
            <form class="modal-content border-0 rounded-4" id="contactForm">
              <div class="modal-header p-4">
                <h1 class="modal-title fs-4 fw-bold" id="staticBackdropLabel">Add New Contact</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body px-4 px-sm-5">
                <div class="text-center mb-4">
                  <div
                    class="contact-photo mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle text-white">
                    <i class="fa-solid fa-user fs-2"></i>
                  </div>
                  <input type="file" id="contactImage" accept="image/*" hidden>
                  <label for="contactImage" class="btn btn-light text-secondary fw-medium">
                    <i class="fa-solid fa-camera me-1"></i> Change Photo
                  </label>
                </div>

                <div class="mb-4">
                  <label for="fullName" class="form-label fw-medium">Full Name <span
                      class="text-danger">*</span></label>
                  <input type="text" class="form-control contact-input bg-light rounded-4" id="fullName"
                    placeholder="Enter full name" required>
                </div>
                <div class="mb-4">
                  <label for="phone" class="form-label fw-medium">Phone Number <span
                      class="text-danger">*</span></label>
                  <input type="tel" class="form-control contact-input bg-light rounded-4" id="phone"
                    placeholder="e.g., 01012345678" required>
                </div>
                <div class="mb-4">
                  <label for="email" class="form-label fw-medium">Email Address</label>
                  <input type="email" class="form-control contact-input bg-light rounded-4" id="email"
                    placeholder="name@example.com">
                </div>
                <div class="mb-4">
                  <label for="address" class="form-label fw-medium">Address</label>
                  <input type="text" class="form-control contact-input bg-light rounded-4" id="address"
                    placeholder="Enter address">
                </div>
                <div class="mb-4">
                  <label for="group" class="form-label fw-medium">Group</label>
                  <select class="form-select contact-input bg-light rounded-4" id="group">
                    <option value="" selected>Select a group</option>
                    <option>Family</option>
                    <option>Friends</option>
                    <option>Work</option>
                  </select>
                </div>
                <div class="mb-4">
                  <label for="notes" class="form-label fw-medium">Notes</label>
                  <textarea class="form-control contact-input contact-textarea bg-light rounded-4" id="notes" rows="3"
                    placeholder="Add notes about this contact"></textarea>
                </div>
                <div class="d-flex flex-wrap gap-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="favorite">
                    <label class="form-check-label" for="favorite">⭐ Favorite</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="emergency">
                    <label class="form-check-label" for="emergency">💗 Emergency</label>
                  </div>
                </div>
              </div>
              <div class="modal-footer border-0 pt-0 px-4 px-sm-5 pb-4">
                <button type="button" class="btn contact-action-btn btn-light rounded-4 fw-semibold flex-grow-1"
                  data-bs-dismiss="modal">Cancel</button>
                <button type="button" onclick="addContact()"
                  class="btn contact-action-btn bg-purple text-white border-0 rounded-4 fw-semibold flex-grow-1">
                  <i class="fa-solid fa-check me-1"></i> Save Contact
                </button>
              </div>
            </form>
          </div>
        </div>
        <div class="navIcon w-12 h-12 d-none d-sm-flex justify-content-center align-items-center rounded-3">
          <span class="fa-solid fa-bell"></span>
        </div>
        <div class="navIcon w-12 h-12 d-none d-sm-flex justify-content-center align-items-center rounded-3">
          <span class="fa-solid fa-gear"></span>
        </div>
        <div class="navImg w-12">
          <figure class="mb-0">
            <img src="images/navbar-icon.jpg" class="w-100 rounded-3" alt="navbar-image">
          </figure>
        </div>
      </div>
    </div>
  </nav>
  <main class="contact-dashboard py-4 py-md-5">
    <div class="container-xl px-3 px-md-4">
      <section class="mb-4 mb-md-5">
        <div class="row g-3 g-md-4 mb-4">
          <div class="col-12 col-md-4">
            <div class="stat-card bg-white border shadow-sm rounded-4 p-3 p-md-4 h-100 d-flex align-items-center gap-3">
              <div
                class="stat-icon bg-primary d-inline-flex flex-shrink-0 align-items-center justify-content-center rounded-4 text-white shadow">
                <i class="fa-solid fa-users"></i>
              </div>
              <div>
                <p class="mb-1 text-uppercase text-secondary small">Total</p><strong id="totalCount"
                  class="text-dark fs-3 lh-1">0</strong>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="stat-card bg-white border shadow-sm rounded-4 p-3 p-md-4 h-100 d-flex align-items-center gap-3">
              <div
                class="stat-icon bg-warning d-inline-flex flex-shrink-0 align-items-center justify-content-center rounded-4 text-white shadow">
                <i class="fa-solid fa-star"></i>
              </div>
              <div>
                <p class="mb-1 text-uppercase text-secondary small">Favorites</p><strong id="favoriteCount"
                  class="text-dark fs-3 lh-1">0</strong>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="stat-card bg-white border shadow-sm rounded-4 p-3 p-md-4 h-100 d-flex align-items-center gap-3">
              <div
                class="stat-icon bg-danger d-inline-flex flex-shrink-0 align-items-center justify-content-center rounded-4 text-white shadow">
                <i class="fa-solid fa-heart-pulse"></i>
              </div>
              <div>
                <p class="mb-1 text-uppercase text-secondary small">Emergency</p><strong id="emergencyCount"
                  class="text-dark fs-3 lh-1">0</strong>
              </div>
            </div>
          </div>
        </div>
        <div class="row g-4">
          <div class="col-12 col-lg-9">
            <h2 class="fw-bold mb-1">All Contacts</h2>
            <p class="text-secondary mb-4">Manage and organize your <span id="contactsTextCount">0</span> contacts</p>
            <div class="input-group search-box border rounded-4 overflow-hidden mb-4">
              <span class="input-group-text border-0 bg-white text-secondary">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input oninput="search(this.value)" class="form-control border-0 shadow-none text-secondary" type="search"
                id="searchInput" placeholder="Search by name, phone, or email..." aria-label="Search contacts">
            </div>
            <div class="row g-3 g-md-4" id="contacts">

            </div>
            <div class="empty-state d-flex flex-column align-items-center justify-content-center text-center"
              id="contactsEmpty">
              <div class="empty-icon mb-3 d-flex align-items-center justify-content-center rounded-4">
                <i class="fa-regular fa-address-book"></i>
              </div>
              <h3 class="fs-5 text-secondary mb-2">No contacts found</h3>
              <p class="text-secondary mb-0">Click "Add Contact" to get started</p>
            </div>
          </div>

          <div class="col-12 col-lg-3">
            <div class="quick-card bg-white border shadow-sm rounded-4 overflow-hidden mb-4">
              <div class="quick-card-head favorite-head d-flex align-items-center gap-3 p-4">
                <div
                  class="stat-icon bg-warning d-inline-flex flex-shrink-0 align-items-center justify-content-center rounded-4 text-white shadow">
                  <i class="fa-solid fa-star"></i>
                </div>
                <div>
                  <h3 class="fs-5 fw-semibold mb-1">Favorites</h3>
                  <p class="small text-secondary mb-0">Quick access to starred contacts</p>
                </div>
              </div>
              <div id="favoritesContainer" class="quick-card-body p-3">
              </div>

            </div>

            <div class="quick-card bg-white border shadow-sm rounded-4 overflow-hidden">
              <div class="quick-card-head emergency-head d-flex align-items-center gap-3 p-4">
                <div
                  class="stat-icon bg-danger d-inline-flex flex-shrink-0 align-items-center justify-content-center rounded-4 text-white shadow">
                  <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div>
                  <h3 class="fs-5 fw-semibold mb-1">Emergency</h3>
                  <p class="small text-secondary mb-0">Important contacts for urgent calls</p>
                </div>
              </div>
              <div class="quick-card-body p-3" id="emergencyContainer">
              </div>

            </div>
          </div>
      </section>
    </div>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/main.js"></script>
</body>

</html>
